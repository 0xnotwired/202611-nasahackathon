name: API compatibility

on:
  push:
    branches: [main, frontend, backend, "backend/**", "frontend/**"]
    paths:
      [
        "contracts/**",
        "backend/**",
        "src/features/health-monitoring/schemas.ts",
        "src/features/health-monitoring/data/service.ts",
        "src/lib/api/**",
        "package*.json",
        ".github/workflows/contracts.yml",
      ]
  pull_request:
    branches: [main, frontend]
    paths:
      [
        "contracts/**",
        "backend/**",
        "src/features/health-monitoring/schemas.ts",
        "src/features/health-monitoring/data/service.ts",
        "src/lib/api/**",
        "package*.json",
        ".github/workflows/contracts.yml",
      ]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
