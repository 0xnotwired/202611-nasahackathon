name: Frontend backend

on:
  push:
    branches: [main]
    paths: ["frontend/backend/**", "frontend/contracts/**", ".github/workflows/frontend-backend.yml"]
  pull_request:
    paths: ["frontend/backend/**", "frontend/contracts/**", ".github/workflows/frontend-backend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/backend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
