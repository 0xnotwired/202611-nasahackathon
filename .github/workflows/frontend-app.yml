name: Frontend app

# The teammate's Next.js frontend in frontend/. Separate from the root app's own workflow (app.yml):
# each runs only when its own files change, and the names and concurrency groups differ.
on:
  push:
    branches: [main]
    paths: ["frontend/src/**", "frontend/public/**", "frontend/tests/**", "frontend/contracts/models.ts", "frontend/contracts/schemas.ts", "frontend/package*.json", "frontend/*config*", "frontend/.nvmrc", ".github/workflows/frontend-app.yml"]
  pull_request:
    paths: ["frontend/src/**", "frontend/public/**", "frontend/tests/**", "frontend/contracts/models.ts", "frontend/contracts/schemas.ts", "frontend/package*.json", "frontend/*config*", "frontend/.nvmrc", ".github/workflows/frontend-app.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
