name: Frontend

on:
  push:
    branches: [main, frontend, "frontend/**"]
    paths:
      [
        "src/**",
        "public/**",
        "tests/**",
        "contracts/models.ts",
        "contracts/schemas.ts",
        "package*.json",
        "*config*",
        ".nvmrc",
        ".github/workflows/ci.yml",
      ]
  pull_request:
    branches: [main, frontend]
    paths:
      [
        "src/**",
        "public/**",
        "tests/**",
        "contracts/models.ts",
        "contracts/schemas.ts",
        "package*.json",
        "*config*",
        ".nvmrc",
        ".github/workflows/ci.yml",
      ]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
