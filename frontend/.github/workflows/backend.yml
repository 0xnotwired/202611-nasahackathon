name: Backend

on:
  push:
    branches: [main, frontend, backend, "backend/**"]
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main, frontend]
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
